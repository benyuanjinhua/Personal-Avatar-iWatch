name: WristAgent

options:
  bundleIdPrefix: com.benyuan.wristagent
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    WRISTAGENT_BUNDLE_ID: com.benyuan.wristagent.WristAgent
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WristAgent:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: 腕语
        UILaunchScreen: {}
    entitlements:
      path: iOS/WristAgent.entitlements
    dependencies:
      - target: WristAgent Watch App
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTAGENT_BUNDLE_ID)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

  WristAgent Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Jackson Avatar
        NSMicrophoneUsageDescription: 腕语需要使用麦克风，把你的语音指令发送给云端 Agent。
        NSLocalNetworkUsageDescription: 腕语仅在开发联调时连接同一局域网内的 Agent Gateway。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        WKCompanionAppBundleIdentifier: $(WRISTAGENT_BUNDLE_ID)
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        # ESS-45：audio = 熄屏/后台继续播结果语音；self-care = ExtendedRuntimeSession
        # 类型（系统上限 10 分钟），覆盖录音→等待→播放的整个语音回合。
        WKBackgroundModes:
          - audio
          - self-care
        # ESS-58：单 target watch app 的后台音频键，Apple 文档口径（Playing
        # Background Audio）写 UIBackgroundModes、Xcode capability 写
        # WKBackgroundModes——双写兜底，配 .longFormAudio 会话锁屏不断播。
        UIBackgroundModes:
          - audio
    entitlements:
      path: Watch/WristAgentWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTAGENT_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    scheme:
      testTargets:
        - WristAgent Watch Tests

  # ESS-73：watch 模拟器宿主单测——swift test 编不到 Watch target，
  # 中断残留等运行时行为只能在 watchOS 进程里复现（R-02 运行时证据）。
  WristAgent Watch Tests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WatchTests
    dependencies:
      - target: WristAgent Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRISTAGENT_BUNDLE_ID).watchkitapp.tests
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

schemes:
  WristAgent:
    build:
      targets:
        WristAgent: all
        WristAgent Watch App: all
    run:
      config: Debug
    archive:
      config: Release
